name: Code Quality Checks

# Duplicate code detection, unused dep detection, and version drift checks.
# Runs on every PR and weekly to catch accumulating technical debt.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Agent branches push repeatedly, and without this every push left the previous
# run of this workflow occupying a runner slot until it finished on a commit
# nobody was waiting for. Superseded pull_request runs are cancelled; scheduled
# and merge_group runs are never cancelled.
concurrency:
  group: code-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  duplicate-code:
    name: Duplicate Code Detection (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Run jscpd duplicate code detection
        run: |
          set -euo pipefail
          # jscpd exits non-zero when the duplication threshold is exceeded.
          # We capture output for the artifact while still propagating the exit code.
          if ! npx jscpd@4 \
            --config .jscpd.json \
            --reporters console,json \
            --output ./jscpd-report \
            . 2>&1 | tee jscpd-output.txt; then
            echo "::error::Duplicate code threshold exceeded. Review the jscpd-duplication-report artifact."
            exit 1
          fi
          echo "jscpd: duplication within threshold."

      - name: Reject vacuous duplicate-code reports
        run: node scripts/ci/verify-jscpd-report.mjs ./jscpd-report/jscpd-report.json

      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24-native)
        with:
          name: jscpd-duplication-report
          path: jscpd-report/

  version-drift:
    name: Version Drift Detection (syncpack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Check for version drift across packages
        run: |
          set -euo pipefail
          echo "==> Checking for dependency version drift across all packages..."
          npx syncpack@13 list-mismatches --config .syncpackrc.json | tee syncpack-output.txt
          if grep -qE "^✘" syncpack-output.txt; then
            echo ""
            echo "::error::Version drift detected. Run 'npx syncpack fix-mismatches' to resolve."
            exit 1
          fi
          echo "No version drift detected."

  unused-deps-functions:
    name: Unused Dependencies (functions)
    runs-on: ubuntu-latest
    # 2026-09-03/04 npm registry degradation: this job was killed at its
    # hard cap with clean partial output (see PR #2507 CI history), so a
    # slow registry was reported as a job failure. 30m rides out the
    # degradation; the gate itself is unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-identity/package-lock.json
            functions-sync/package-lock.json
            functions-media/package-lock.json
            packages/functions-shared/package-lock.json

      - name: Install Functions codebase dependencies
        run: |
          set -euo pipefail
          for pkg in functions functions-identity functions-sync functions-media packages/functions-shared; do
            npm ci --prefix "$pkg"
          done

      - name: Run knip ratchet (Functions codebases)
        # Enforcing via count baseline (budgets/knip-baseline.json): new
        # findings fail, existing debt is tracked and may only shrink. The
        # previous advisory pipe let findings accumulate invisibly.
        # 3.5 runs one lane per deploy codebase plus the shared runtime; the
        # ratchet builds all lib/ outputs once before the first lane.
        run: |
          set -euo pipefail
          bash scripts/ci/knip-ratchet.sh functions functions
          bash scripts/ci/knip-ratchet.sh functions-identity functions-identity
          bash scripts/ci/knip-ratchet.sh functions-sync functions-sync
          bash scripts/ci/knip-ratchet.sh functions-media functions-media
          bash scripts/ci/knip-ratchet.sh packages/functions-shared functions-shared

      - name: Functions test seams stay live
        # Every src/testing.ts namespace re-export must have a knip-invisible
        # importer; drop the seam when its tests move or die.
        run: node scripts/ci/verify-functions-test-seams.mjs

      - name: Functions test-seam verifier self-test
        run: node scripts/ci/verify-functions-test-seams.test.mjs

      - name: Functions vendor pins stay identical
        # Pinned vendor blobs (brace-expansion-cjs, domain-core-wasm) are
        # duplicated per codebase for self-contained deploys; they must stay
        # byte-identical or deploys silently diverge.
        run: node scripts/ci/verify-functions-vendor-pins.mjs

      - name: Functions vendor-pin verifier self-test
        run: node scripts/ci/verify-functions-vendor-pins.test.mjs

      - name: Functions codebases stay isolated
        # Runtime sources must not import across codebase boundaries; tests
        # own the sibling-src channel and harnesses the sibling-lib channel.
        run: node scripts/ci/verify-functions-codebase-isolation.mjs

      - name: Functions isolation verifier self-test
        run: node scripts/ci/verify-functions-codebase-isolation.test.mjs

  unused-deps-extension:
    name: Unused Dependencies (extension)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extensions/openburnbar/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix extensions/openburnbar

      - name: Run knip ratchet (extension)
        run: bash scripts/ci/knip-ratchet.sh extensions/openburnbar extension

  structural-debt-ratchets:
    name: Structural Debt Ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Run structural debt ratchets
        run: |
          set -euo pipefail
          bash scripts/debt/check-datastore-isolation-budget.sh
          bash scripts/debt/check-singleton-budget.sh
          bash scripts/debt/check-raw-firestore-budget.sh
          bash scripts/debt/check-string-any-boundary-budget.sh

  dependency-boundaries:
    name: Dependency Boundaries (dependency-cruiser)
    runs-on: ubuntu-latest
    # 2026-09-03/04 npm registry degradation: this job was killed at its
    # hard cap with clean partial output (see PR #2507 CI history), so a
    # slow registry was reported as a job failure. 30m rides out the
    # degradation; the gate itself is unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            extensions/openburnbar/package-lock.json

      # dependency-cruiser is pinned in the extension's lockfile (18.4.0);
      # functions does not depend on it, so the old `npx --prefix functions
      # depcruise` fetched the unrelated `depcruise` placeholder package. Both
      # scans run the pinned binary from the package directory, because each
      # config's paths (`^src/`, `tsconfig.json`) are relative to it: run from
      # the repo root, both scans died with TS5083 and the `|| true` plus a
      # `^error` grep read that as clean. depcruise exits non-zero on any
      # error-severity violation, which now fails the step.
      - name: Install dependencies (resolution targets + pinned depcruise)
        run: |
          npm ci --prefix functions
          npm ci --prefix extensions/openburnbar

      - name: Check dependency boundaries (functions)
        working-directory: functions
        run: ../extensions/openburnbar/node_modules/.bin/depcruise --config .dependency-cruiser.cjs --output-type err src

      - name: Check dependency boundaries (extension)
        working-directory: extensions/openburnbar
        run: node_modules/.bin/depcruise --config .dependency-cruiser.cjs --output-type err src

  bundle-size:
    name: Bundle Size (size-limit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc

      - name: Install extension dependencies and build
        run: |
          npm ci --prefix extensions/openburnbar
          npm run build --prefix extensions/openburnbar

      - name: Check extension bundle size
        run: |
          set -euo pipefail
          cd extensions/openburnbar
          # size-limit's exit code IS the budget check — swallowing it meant
          # bundle regressions could never fail this lane.
          npx size-limit --json 2>&1 | tee size-limit-extension.txt

      # The website size-limit step was removed: size-limit was never a
      # dependency of website/ and had no config, so the step had never
      # measured anything (it ran `|| true` over a missing tool). Per the
      # advisory-lane policy, a lane that asserts nothing is removed rather
      # than left green-washing; re-add it deliberately with a config and a
      # verified budget if website bundle size becomes a tracked concern.

      - name: Upload size reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24-native)
        with:
          name: bundle-size-reports
          path: extensions/openburnbar/size-limit-extension.txt

  android-dependency-health:
    name: Android Dependency Health (dependency-analysis)
    runs-on: ubuntu-latest
    # Cold hosted runs compile benchmarkRelease, debug, nonMinifiedRelease,
    # and release serially. The 20m cap killed a progressing final variant
    # (run 36669658030), so allow the complete analysis to finish.
    timeout-minutes: 45
    env:
      TRUSTED_PR_SECRET_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) }}
      HAS_ANDROID_FIREBASE_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (node24-native)
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Use Android Firebase template for untrusted PRs
        if: env.TRUSTED_PR_SECRET_RUN != 'true' || env.HAS_ANDROID_FIREBASE_SECRET != 'true'
        run: cp android/app/google-services.json.template android/app/google-services.json

      - name: Inject Android Firebase config
        if: env.TRUSTED_PR_SECRET_RUN == 'true' && env.HAS_ANDROID_FIREBASE_SECRET == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          OPENBURNBAR_ANDROID_FIREBASE_STRICT: "true"
        run: bash ./scripts/ci/inject-firebase-config-android.sh

      - name: Self-test dependency-analysis failure propagation
        run: node --test scripts/ci/android-dependency-health.test.mjs

      - name: Run dependency-analysis buildHealth
        run: |
          set -euo pipefail
          cd android
          # :app:buildHealth never existed (buildHealth is a root-project task
          # in dependency-analysis v2, and the plugin is applied per-project) —
          # the old '|| true' + warning masked a task-not-found failure on
          # every run this lane ever had. projectHealth is the real per-module
          # task; verified green locally on plugin 2.19.0.
          # Single-JVM compile: compile Kotlin inside Gradle's 6g heap instead
          # of the shared Kotlin daemon (gradle.properties caps it at 3g). KGP
          # only reads the strategy as a Gradle property (-P); the old
          # -Dkotlin.compiler.execution.strategy system property was silently
          # ignored, so every variant compiled in the 3g daemon and died with
          # "GC overhead limit exceeded" wrapped as backend codegen errors.
          # One worker keeps a single variant's compiler on the heap at a time.
          ./gradlew :app:projectHealth --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs=-Xmx6g \
            -Pkotlin.compiler.execution.strategy=in-process \
            2>&1 | tee ../android-dep-health.txt
          if grep -qE "^BUILD FAILED" ../android-dep-health.txt; then
            echo "::error::Android dependency-analysis buildHealth FAILED. Review android-dep-health artifact."
            exit 1
          fi
          echo "Android dependency health check complete."

      - name: Upload Android dependency health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24-native)
        with:
          name: android-dependency-health
          path: android-dep-health.txt

  build-performance:
    name: Build Timing Summary
    runs-on: ubuntu-latest
    # 2026-09-03/04 npm registry degradation: this job was killed at its
    # hard cap with clean partial output (see PR #2507 CI history), so a
    # slow registry was reported as a job failure. 30m rides out the
    # degradation; the gate itself is unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24-native; June 16 forced-runtime fuse)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24-native)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Time functions build
        run: |
          # Local packages first (outside the timer): functions' prebuild sync
          # skips unbuilt packages, leaving vendor lib/ empty and tsc red.
          bash scripts/build-signal-envelope-contracts.sh
          bash scripts/build-entitlements.sh
          bash scripts/build-functions-shared.sh
          START=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          npm ci --prefix functions
          npm run build --prefix functions
          END=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          DURATION=$(( END - START ))
          {
            echo "### Build Performance"
            echo ""
            echo "| Package | Duration |"
            echo "|---------|----------|"
            echo "| functions (npm ci + tsc) | ${DURATION}ms |"
          } >> "$GITHUB_STEP_SUMMARY"
